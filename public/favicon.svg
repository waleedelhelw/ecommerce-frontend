<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bgGrad)"/>

  <!-- Shopping Bag Body -->
  <path d="M25 38 L75 38 L72 82 Q71 87 66 87 L34 87 Q29 87 28 82 Z"
        fill="url(#bagGrad)"
        stroke="#ffffff"
        stroke-width="1"/>

  <!-- Bag Handles -->
  <path d="M37 38 L37 28 Q37 20 50 20 Q63 20 63 28 L63 38"
        stroke="#ffffff"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"/>

  <!-- Letter "ت" - Two Dots -->
  <circle cx="44" cy="55" r="2.5" fill="#667eea"/>
  <circle cx="56" cy="55" r="2.5" fill="#667eea"/>

  <!-- Letter "ت" - Curved Bottom -->
  <path d="M38 65 Q50 75 62 65"
        stroke="#667eea"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"/>
</svg>